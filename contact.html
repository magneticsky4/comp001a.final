<main class="container">
  
<section>
  <h2>Contact Us</h2>
  <form action="#" method="post" class="card" novalidate>
    <label for="name">Full name</label>
    <input id="name" class="form-control" name="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" class="form-control" name="email" type="email" required>

    <label for="topic">Topic</label>
    <select id="topic" class="form-control" name="topic">
      <option value="general">General</option>
      <option value="volunteer">Volunteer</option>
    </select>

    <fieldset>
      <legend>Interests</legend>
      <label><input type="checkbox" name="interest" value="events"> Events</label>
      <label><input type="checkbox" name="interest" value="workshops"> Workshops</label>
    </fieldset>

    <label for="message">Message</label>
    <textarea id="message" class="form-control" name="message" rows="5"></textarea>

    <button type="submit" style="background:#2E7D32;color:#fff;border:none;padding:0.6rem 1rem;border-radius:4px;">Send</button>
  </form>
</section>

</main>
