<main class="container">
  
<section>
  <h2>Book an Eco-Trip</h2>
  <form class="card" action="#" method="post">
    <label for="fullname">Full Name</label>
    <input id="fullname" class="form-control" name="fullname" type="text" required>

    <label for="trip">Choose Trip</label>
    <select id="trip" class="form-control" name="trip">
      <option value="forest">Misty Forest Trails</option>
      <option value="coast">Coastal Cleanup Beach</option>
    </select>

    <label for="date">Preferred Date</label>
    <input id="date" class="form-control" name="date" type="date">

    <fieldset>
      <legend>Travel Options</legend>
      <label><input type="radio" name="option" value="standard" checked> Standard</label>
      <label><input type="radio" name="option" value="premium"> Premium</label>
    </fieldset>

    <button type="submit" style="background:#F2B632;color:#000;border:none;padding:0.6rem 1rem;border-radius:4px;">Request Booking</button>
  </form>
</section>

</main>
